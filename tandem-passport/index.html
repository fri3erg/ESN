<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tandem Passport</title>
  <meta name="description" content="Talk to new people, collect every sticker in your passport, enter the prize draw.">
  <meta name="theme-color" content="#ffd23f">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23ffd23f'/%3E%3Ccircle cx='50' cy='52' r='30' fill='%23ff5d73' stroke='%23fff' stroke-width='7'/%3E%3Ctext x='50' y='64' font-size='34' text-anchor='middle' font-family='Arial' font-weight='900' fill='%23fff'%3E%E2%9C%93%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --sun: #ffd23f; --sun-dark: #e0b11c; --cream: #fff6d6; --edge: #c9a227; --ink: #2b1d0e;
      --pink: #ff5d73; --pink-dark: #c23347; --purple: #7b4fd6; --purple-dark: #4f2c9e;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --mono: ui-monospace, "SF Mono", Consolas, monospace;
      --hand: "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: var(--sun); color: var(--ink); font: 18px/1.45 var(--sans); overflow-x: hidden; }
    button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

    .screen { max-width: 480px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
    .kick { font: 800 12px var(--mono); letter-spacing: .2em; margin: 0; }

    .btn { display: block; width: 100%; min-height: 62px; border: 0; border-radius: 18px; background: var(--pink); color: #fff; font-size: 20px; font-weight: 900; letter-spacing: .04em; box-shadow: 0 6px 0 var(--pink-dark); }
    .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--pink-dark); }
    .btn:disabled { opacity: .45; cursor: default; transform: none; }
    .btn.sun { background: var(--sun); color: var(--ink); box-shadow: 0 6px 0 var(--sun-dark); }
    .btn.sun:active { box-shadow: 0 2px 0 var(--sun-dark); }
    .btn2 { display: block; width: 100%; min-height: 54px; border: 2.5px solid currentColor; border-radius: 16px; background: transparent; font-size: 18px; font-weight: 800; }

    /* top bar on every screen after the cover */
    .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 14px; min-height: 62px; }
    .barbtn { min-height: 44px; border: 0; background: var(--ink); color: var(--sun); border-radius: 999px; padding: 6px 15px; font-weight: 900; font-size: 16px; box-shadow: 0 3px 0 rgba(0, 0, 0, .25); }

    /* round sticker: white die-cut edge, colour, emoji, name */
    .stamp { --size: min(100%, 124px); width: var(--size); aspect-ratio: 1; border-radius: 50%; background: var(--c); color: #fff; border: .45em solid #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; transform: rotate(var(--r)); font: 900 10px/1.1 var(--sans);
      box-shadow: 0 .45em 0 rgba(43, 29, 14, .22), 0 .2em .8em rgba(43, 29, 14, .25); position: relative; overflow: hidden; }
    .stamp::after { content: ""; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255, 255, 255, .45), transparent 45%); }
    .stamp i { font-style: normal; font-size: 3em; line-height: 1; }
    .stamp b { font-size: 1.15em; letter-spacing: .02em; margin-top: .35em; padding: 0 .4em; }
    .stamp small { font: 800 .85em var(--mono); margin-top: .2em; opacity: .9; }
    .stamp.big { --size: min(74vw, 270px); font-size: clamp(18px, 6vw, 24px); }

    /* cover */
    .cover { padding: 20px 18px calc(22px + env(safe-area-inset-bottom)); gap: 16px; }
    .cover h1 { margin: 2px 0 0; font: 900 clamp(48px, 15vw, 66px)/.95 var(--sans); transform: rotate(-2deg); letter-spacing: -.01em; }
    .cover h1 span { color: var(--purple); }
    .deco { position: relative; height: 92px; }
    .deco .stamp { position: absolute; --size: 78px; font-size: 7px; }
    .deco .stamp i { font-size: 4.2em; }
    .rules { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
    .rules li { display: flex; gap: 12px; align-items: center; background: #fff; border-radius: 16px; padding: 13px 14px; font-weight: 750; font-size: 17.5px; line-height: 1.3; box-shadow: 0 4px 0 rgba(43, 29, 14, .18); }
    .rules b.n { flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--pink); color: #fff; display: grid; place-items: center; font-size: 18px; }
    .cover .btn { margin-top: auto; }
    .cover .field input { font: 800 20px var(--sans); }

    /* passport page */
    .page { flex: 1; display: flex; flex-direction: column; padding: 0 14px calc(16px + env(safe-area-inset-bottom)); gap: 10px; }
    .pagehead h2 { margin: 0; font: 900 30px/1 var(--sans); transform: rotate(-1.5deg); }
    .dots { display: flex; gap: 6px; margin-top: 10px; align-items: center; }
    .dots i { flex: 1; max-width: 46px; height: 11px; border-radius: 999px; background: rgba(43, 29, 14, .18); }
    .dots i.on { background: var(--pink); }
    .dots .kick { margin-left: auto; }
    .slots { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(3, 1fr); gap: 12px; min-height: 390px; }
    .slot { position: relative; border-radius: 18px; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 8px; min-height: 0; }
    .slot .no { position: absolute; top: 7px; left: 10px; font: 800 10px var(--mono); letter-spacing: .14em; opacity: .6; }
    .slot.hidden { background: var(--cream); border: 3px dashed var(--edge); color: #8a6d1d; }
    .slot.hidden .q { font: 900 58px/1 var(--sans); }
    .slot.hidden .tap { font: 800 11px var(--mono); letter-spacing: .18em; margin-top: 2px; }
    .slot.hidden:active { transform: scale(.96); }
    .slot.open { background: var(--c); color: #fff; box-shadow: 0 5px 0 rgba(43, 29, 14, .25); animation: wiggle 2.4s ease-in-out infinite; }
    .slot.open .e { font-size: 36px; line-height: 1; }
    .slot.open b { font-size: 18px; line-height: 1.1; margin-top: 6px; }
    .slot.open small { font: 800 11px var(--mono); letter-spacing: .14em; margin-top: 7px; background: rgba(255, 255, 255, .25); border-radius: 999px; padding: 3px 9px; }
    @keyframes wiggle { 0%, 80%, 100% { transform: rotate(0); } 85% { transform: rotate(-2.5deg); } 90% { transform: rotate(2.5deg); } 95% { transform: rotate(-1deg); } }
    .slot.done { background: transparent; }
    .slot.flipin { animation: flipin .5s ease-out both; }
    @keyframes flipin { from { transform: perspective(500px) rotateY(90deg); } to { transform: perspective(500px) rotateY(0); } }
    .slot.fresh .stamp { animation: fresh .9s ease-out; }
    @keyframes fresh { 0% { transform: rotate(var(--r)) scale(1.3); } 60% { transform: rotate(var(--r)) scale(.95); } 100% { transform: rotate(var(--r)) scale(1); } }
    .hint { margin: 0; text-align: center; font-weight: 800; font-size: 16px; }

    /* mission */
    .mission { flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 0 14px calc(18px + env(safe-area-inset-bottom)); }
    .qcard { background: #fff; border-radius: 24px; padding: 16px; transform: rotate(-1deg); box-shadow: 0 8px 0 rgba(43, 29, 14, .2); display: flex; flex-direction: column; gap: 10px; border-top: 10px solid var(--c); }
    .qcard .no { font: 800 12px var(--mono); letter-spacing: .2em; opacity: .6; margin: 0; }
    .qcard .e { font-size: 50px; line-height: 1; }
    .qcard h2 { margin: 0; font: 900 clamp(30px, 9.5vw, 38px)/1.05 var(--sans); color: var(--c); }
    .qcard .text { margin: 0; font-size: 18.5px; font-weight: 700; line-height: 1.35; }
    .starter { background: var(--sun); border-radius: 14px; padding: 10px 12px; transform: rotate(.8deg); }
    .starter small { display: block; font: 800 11px var(--mono); letter-spacing: .16em; margin-bottom: 3px; }
    .starter i { font-size: 18px; font-weight: 600; }
    .field { display: grid; gap: 3px; }
    .field span { font: 800 11px var(--mono); letter-spacing: .16em; opacity: .7; }
    .field input { font: 21px var(--hand); color: var(--ink); background: #fff; border: 2.5px solid var(--ink); padding: 7px 10px; border-radius: 12px; width: 100%; }
    .field input:focus { outline: none; border-color: var(--pink); box-shadow: 0 0 0 3px rgba(255, 93, 115, .25); }
    .mission .actions { margin-top: auto; padding-top: 6px; }
    /* the card fills the space down to the button; its content sits in the middle, the number stays on top */
    .mission .qcard { flex: 1; gap: 14px; align-items: center; text-align: center; }
    .mission .qcard .no { margin-bottom: auto; align-self: flex-start; }
    .mission .qcard .e { font-size: 58px; width: 112px; height: 112px; border-radius: 50%; border: 4px dashed var(--c); display: grid; place-items: center; }
    .mission .qcard .starter, .mission .qcard .field { align-self: stretch; text-align: left; }
    .mission .qcard .starter { text-align: center; }
    .nexthint { margin: auto 0 0; font: 800 12px var(--mono); letter-spacing: .14em; opacity: .55; }
    .stamped-here { display: flex; justify-content: center; margin: 4px 0; }
    .saved { font: 20px var(--hand); text-align: center; margin: 0; }

    /* the sticker getting slapped on */
    .fx { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: rgba(255, 210, 63, .97); overflow: hidden; }
    .fx .stamp { animation: slam .55s cubic-bezier(.55, 0, .75, .4) both; }
    .fx h2 { margin: 0; font: 900 44px var(--sans); color: var(--ink); transform: rotate(-3deg); animation: appear .3s .55s both; }
    .fx .bit { position: absolute; width: 12px; height: 18px; border-radius: 3px; opacity: 0; animation: burst .7s .5s ease-out forwards; }
    body.shake .fx { animation: shake .35s .5s; }
    @keyframes slam { 0% { transform: translateY(-30vh) rotate(-40deg) scale(2.8); opacity: 0; } 70% { opacity: 1; } 100% { transform: rotate(var(--r)) scale(1); } }
    @keyframes appear { from { transform: translateY(12px) rotate(-3deg); opacity: 0; } }
    @keyframes burst { from { transform: translate(0, 0) rotate(0); opacity: 1; } to { transform: translate(var(--x), var(--y)) rotate(320deg); opacity: 0; } }
    @keyframes shake { 0%, 100% { transform: translate(0, 0); } 20% { transform: translate(-7px, 5px); } 40% { transform: translate(6px, -4px); } 60% { transform: translate(-4px, 3px); } 80% { transform: translate(3px, -2px); } }

    /* complete: drifting background + light sweeping the card, so a screenshot looks obviously dead.
       A determined cheater can still fake it; the stakes are a ticket in the draw. */
    body.end { background: linear-gradient(120deg, #4f2c9e, #7b4fd6, #ff5d73, #4f2c9e); background-size: 300% 300%; animation: drift 6s linear infinite alternate; }
    @keyframes drift { from { background-position: 0% 50%; } to { background-position: 100% 50%; } }
    .done { padding: 0 14px calc(18px + env(safe-area-inset-bottom)); gap: 12px; color: #fff; }
    .done .bar { padding: 10px 0; }
    .done .barbtn { background: var(--sun); color: var(--ink); }
    .ach { position: relative; overflow: hidden; background: #fff; color: var(--ink); border-radius: 24px; padding: 18px 16px; text-align: center; box-shadow: 0 8px 0 rgba(0, 0, 0, .2); transform: rotate(-1deg); }
    .ach::after { content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 40%; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .7), transparent); animation: shine 2.6s linear infinite; pointer-events: none; }
    @keyframes shine { from { transform: translateX(-140%) skewX(-20deg); } to { transform: translateX(300%) skewX(-20deg); } }
    .ach h1 { margin: 0 0 6px; font: 900 34px/1 var(--sans); color: var(--purple); }
    .ach p { margin: 0; font-weight: 800; font-size: 18px; line-height: 1.3; }
    .ach .who { font: 900 26px/1.1 var(--sans); margin: 2px 0 8px; overflow-wrap: anywhere; }
    .sendst { text-align: center; margin: 0; font-weight: 800; font-size: 15px; background: rgba(0, 0, 0, .22); border-radius: 999px; padding: 5px 12px; align-self: center; }
    .ticket { display: inline-block; margin-top: 12px; background: var(--sun); border-radius: 14px; padding: 6px 14px; font: 900 24px var(--mono); letter-spacing: .1em; }
    .stamp-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 14px; justify-items: center; padding: 4px 10px; }
    .stamp-row .stamp { --size: 78px; font-size: 6.5px; animation: pop .5s both; }
    .stamp-row .stamp:nth-child(2) { animation-delay: .1s; } .stamp-row .stamp:nth-child(3) { animation-delay: .2s; } .stamp-row .stamp:nth-child(4) { animation-delay: .3s; }
    .stamp-row .stamp:nth-child(5) { animation-delay: .4s; } .stamp-row .stamp:nth-child(6) { animation-delay: .5s; }
    @keyframes pop { from { transform: rotate(var(--r)) scale(0); } 70% { transform: rotate(var(--r)) scale(1.15); } to { transform: rotate(var(--r)) scale(1); } }
    .stamp-row .stamp small { display: none; }
    .newword { text-align: center; margin: 0; font-size: 16px; font-weight: 700; }
    .newword b { font: 20px var(--hand); color: var(--sun); }
    .stampt { text-align: center; font: 800 12px var(--mono); letter-spacing: .2em; margin: 0; }
    .stampt b { display: block; font-size: 36px; letter-spacing: .02em; color: var(--sun); text-shadow: 0 3px 0 rgba(0, 0, 0, .2); }
    .done .actions { margin-top: auto; }
    .btn.again { min-height: 72px; font-size: 24px; }

    /* bottom sheet */
    .dim { position: fixed; inset: 0; background: rgba(43, 29, 14, .7); display: flex; align-items: flex-end; justify-content: center; padding: 12px; z-index: 40; overflow-y: auto; }
    .sheet { width: 100%; max-width: 460px; background: var(--sun); border-radius: 24px; padding: 18px; display: grid; gap: 12px; margin: auto 0 env(safe-area-inset-bottom); box-shadow: 0 8px 0 rgba(0, 0, 0, .25); color: var(--ink); }
    .sheet h2 { margin: 0; font: 900 28px var(--sans); }
    .sheet p { margin: 0; font-size: 18px; }

    @media (max-height: 700px) {
      .cover { gap: 10px; padding-top: 12px; }
      .deco { height: 64px; } .deco .stamp { --size: 58px; font-size: 5.2px; }
      .rules li { padding: 9px 12px; font-size: 16px; }
      .slots { min-height: 300px; gap: 9px; }
      .slot.hidden .q { font-size: 46px; }
      .slot .stamp { --size: min(100%, 92px); font-size: 8.5px; }
      .page .btn { min-height: 54px; font-size: 18px; }
      .qcard { gap: 8px; padding: 12px 14px; }
      .qcard .e { font-size: 38px; }
      .mission .qcard { gap: 9px; }
      .mission .qcard .e { font-size: 38px; width: 70px; height: 70px; border-width: 3px; }
      .mission .qcard:has(.field) .e { display: none; }
      .qcard .text { font-size: 16.5px; }
      .ach { padding: 12px; } .ach h1 { font-size: 27px; } .ach p { font-size: 16px; }
      .ticket { font-size: 20px; margin-top: 8px; }
      .ach .who { font-size: 22px; margin-bottom: 4px; }
      .stamp-row { gap: 4px 10px; padding: 0 10px; } .stamp-row .stamp { --size: 52px; font-size: 4.5px; }
      .done { gap: 9px; } .done .bar { padding: 6px 0; min-height: 54px; }
      .stampt b { font-size: 28px; }
      .btn.again { min-height: 62px; font-size: 22px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <noscript><p style="padding:24px">Please turn on JavaScript, or find a volunteer.</p></noscript>
  <script type="module">
    import { MISSIONS } from './missions.js';
    import * as P from './passport.js';

    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const app = document.getElementById('app');
    const store = P.safeStorage();
    const TILT = [-10, 8, -5, 7, -8, 4];

    if (new URLSearchParams(location.search).has('reset')) {
      P.clear(store);
      history.replaceState(null, '', location.pathname);   // so a reload doesn't reset again
    }
    let state = P.load(store) || P.fresh();
    let view = P.isComplete(state) ? 'done' : P.hasName(state) && state.slots.some(Boolean) ? 'passport' : 'cover';
    let sending = false;
    let openId = null, freshId = null;
    let timers = [];

    const $ = id => document.getElementById(id);
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const persist = () => P.save(store, state);
    const stopTimers = () => { timers.forEach(clearTimeout); timers = []; };
    const slotNo = id => String(state.slots.indexOf(id) + 1).padStart(2, '0');
    const RULES = `<ol class="rules">
        <li><b class="n">1</b><span>Tap a "?" in your passport to get a mission.</span></li>
        <li><b class="n">2</b><span>Talk to someone new to complete it, then stamp it.</span></li>
        <li><b class="n">3</b><span>Passport full? Show a volunteer and enter the prize draw 🎁</span></li>
      </ol>`;
    const bar = left => `<div class="bar">${left}<button class="barbtn" id="rulesbtn">📖 Rules</button></div>`;

    // A sticker. Its tilt follows the slot, so it looks the same everywhere it appears.
    function stampHtml(id, cls = '') {
      const m = P.mission(id);
      const i = Math.max(0, state.slots.indexOf(id));
      const t = P.formatTime(state.stamps[id] || new Date().toISOString());
      return `<div class="stamp ${cls}" style="--c:${m.ink};--r:${TILT[i % TILT.length]}deg"><i aria-hidden="true">${m.emoji}</i><b>${esc(m.stamp)}</b><small>✓ ${t}</small></div>`;
    }

    function render() {
      stopTimers();
      $('sheet')?.remove();
      $('fx')?.remove();
      document.body.classList.remove('shake');
      document.body.classList.toggle('end', view === 'done');
      ({ cover: renderCover, passport: renderPassport, mission: renderMission, done: renderDone })[view]();
      const rb = $('rulesbtn');
      if (rb) rb.onclick = openRules;
      scrollTo(0, 0);
    }

    function renderCover() {
      const deco = MISSIONS.slice(0, 5).map((m, i) =>
        `<div class="stamp" style="--c:${m.ink};--r:${TILT[i]}deg;left:${4 + i * 19}%;top:${i % 2 ? 14 : 0}px"><i>${m.emoji}</i></div>`).join('');
      app.innerHTML = `<main class="screen cover">
        <p class="kick">ESN BOLOGNA · TANDEM NIGHT</p>
        <h1>TANDEM<br><span>PASSPORT</span> ✈️</h1>
        <div class="deco" aria-hidden="true">${deco}</div>
        ${RULES}
        <label class="field"><span>YOUR NAME (FOR THE PRIZE DRAW)</span><input id="name" maxlength="${P.NAME_MAX}" autocomplete="name" enterkeyhint="go" value="${esc(state.name)}"></label>
        <button class="btn" id="open">OPEN MY PASSPORT ▶</button>
      </main>`;
      const input = $('name'), btn = $('open');
      const sync = () => { btn.disabled = !input.value.trim(); };
      input.oninput = sync; sync();
      const go = () => {
        state = P.setName(state, input.value);
        if (!P.hasName(state)) return input.focus();
        persist();
        view = 'passport';
        render();
      };
      btn.onclick = go;
      input.onkeydown = e => { if (e.key === 'Enter') go(); };
    }

    function slotHtml(i) {
      const id = state.slots[i];
      const no = `<span class="no">Nº ${String(i + 1).padStart(2, '0')}</span>`;
      if (!id) return `<button class="slot hidden" data-i="${i}" aria-label="Mystery mission ${i + 1}: tap to reveal">${no}<span class="q">?</span><span class="tap">TAP</span></button>`;
      const m = P.mission(id);
      if (P.isStamped(state, id)) return `<button class="slot done ${freshId === id ? 'fresh' : ''}" data-i="${i}" aria-label="${esc(m.title)}: stamped">${stampHtml(id)}</button>`;
      return `<button class="slot open" data-i="${i}" style="--c:${m.ink}">${no}<span class="e" aria-hidden="true">${m.emoji}</span><b>${esc(m.title)}</b><small>OPEN →</small></button>`;
    }

    function renderPassport() {
      const n = P.stampCount(state);
      app.innerHTML = `<main class="screen">
        ${bar('<span class="kick">ESN · TANDEM NIGHT</span>')}
        <section class="page">
          <div class="pagehead"><h2>My Passport ✈️</h2>
            <div class="dots">${state.slots.map((_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}<span class="kick">STAMPS ${n} / ${P.SLOTS}</span></div></div>
          <div class="slots" id="slots">${state.slots.map((_, i) => slotHtml(i)).join('')}</div>
          ${P.isComplete(state)
            ? '<button class="btn" id="back-done">🏆 MY COMPLETED PASSPORT</button>'
            : `<p class="hint">${state.slots.includes(null) ? 'Tap a "?" to get your next mission' : 'Complete your missions to fill the passport'}</p>`}
        </section>
      </main>`;
      freshId = null;
      $('slots').onclick = e => {
        const el = e.target.closest('.slot');
        if (el) onSlot(Number(el.dataset.i), el);
      };
      const bd = $('back-done');
      if (bd) bd.onclick = () => { view = 'done'; render(); };
    }

    function onSlot(i, el) {
      if (state.slots[i]) { openId = state.slots[i]; view = 'mission'; return render(); }
      if ($('slots').dataset.busy) return;
      state = P.reveal(state, i);
      persist();
      openId = state.slots[i];
      $('slots').dataset.busy = '1';
      el.outerHTML = slotHtml(i);
      $('slots').children[i].classList.add('flipin');
      timers.push(setTimeout(() => { view = 'mission'; render(); }, reduced ? 0 : 750));
    }

    function renderMission() {
      const m = P.mission(openId);
      const done = P.isStamped(state, m.id);
      const input = m.input && !done ? `
        <label class="field"><span>THEIR WORD</span><input id="w-word" autocomplete="off" maxlength="40" enterkeyhint="next"></label>
        <label class="field"><span>WHAT IT MEANS (OPTIONAL)</span><input id="w-meaning" autocomplete="off" maxlength="60" enterkeyhint="done"></label>` : '';
      const saved = m.input && done && state.word ? `<p class="saved">${esc(state.word.word)}${state.word.meaning ? ` · ${esc(state.word.meaning)}` : ''}</p>` : '';
      app.innerHTML = `<main class="screen">
        ${bar('<button class="barbtn" id="back">← Passport</button>')}
        <section class="mission">
          <div class="qcard" style="--c:${m.ink}">
            <p class="no">MISSION Nº ${slotNo(m.id)}</p>
            <div class="e" aria-hidden="true">${m.emoji}</div>
            <h2>${esc(m.title)}</h2>
            <p class="text">${esc(m.text)}</p>
            <div class="starter"><small>💬 TRY ASKING</small><i>"${esc(m.starter)}"</i></div>
            ${input}${saved}
            <p class="nexthint">${done ? 'STICKER COLLECTED ✓' : 'DONE? STAMP IT BELOW 👇'}</p>
          </div>
          ${done ? `<div class="stamped-here">${stampHtml(m.id)}</div>` : '<div class="actions"><button class="btn" id="stamp">STAMP IT ✓</button></div>'}
        </section>
      </main>`;
      $('back').onclick = () => { view = 'passport'; render(); };
      if (done) return;
      const btn = $('stamp');
      if (m.input) {
        const w = $('w-word');
        const sync = () => { btn.disabled = !w.value.trim(); };
        w.oninput = sync; sync();
        w.onkeydown = e => { if (e.key === 'Enter') $('w-meaning').focus(); };
      }
      btn.onclick = () => doStamp(m);
    }

    function doStamp(m) {
      const note = m.input ? { word: $('w-word').value, meaning: $('w-meaning').value } : undefined;
      const before = state;
      state = P.stamp(state, m.id, new Date(), P.secureRandomInt, note);
      if (state === before) return;
      persist();
      document.activeElement?.blur();
      const after = () => { view = P.isComplete(state) ? 'done' : 'passport'; freshId = m.id; render(); };
      if (reduced) return after();
      const fx = document.createElement('div');
      fx.className = 'fx';
      fx.id = 'fx';
      fx.setAttribute('role', 'status');
      const colours = MISSIONS.map(x => x.ink);
      const bits = Array.from({ length: 14 }, (_, k) => {
        const a = (k / 14) * Math.PI * 2, d = 150 + (k % 3) * 40;
        return `<i class="bit" style="left:50%;top:45%;background:${colours[k % colours.length]};--x:${Math.round(Math.cos(a) * d)}px;--y:${Math.round(Math.sin(a) * d)}px"></i>`;
      }).join('');
      fx.innerHTML = `${bits}${stampHtml(m.id, 'big')}<h2>STAMPED!</h2>`;
      document.body.appendChild(fx);
      document.body.classList.add('shake');
      timers.push(setTimeout(() => { try { navigator.vibrate?.(70); } catch { /* not supported */ } }, 500));
      timers.push(setTimeout(after, 1700));
    }

    function renderDone() {
      const w = state.word;
      app.innerHTML = `<main class="screen done">
        <div class="bar"><button class="barbtn" id="view">📖 My passport</button><button class="barbtn" id="rulesbtn">📖 Rules</button></div>
        <section class="ach">
          <h1>PASSPORT FULL! 🏆</h1>
          <p class="who">${esc(state.name)}</p>
          <p>Show this screen to a volunteer to enter the prize draw 🎁</p>
          <div class="ticket">DRAW Nº ${P.formatDraw(state.drawNo)}</div>
        </section>
        <div class="stamp-row" aria-hidden="true">${state.slots.map(id => stampHtml(id)).join('')}</div>
        ${w ? `<p class="newword">Your new word: <b>${esc(w.word)}</b>${w.meaning ? ` · ${esc(w.meaning)}` : ''}</p>` : ''}
        <p class="sendst" id="sendst" role="status"></p>
        <p class="stampt">FINISHED AT<b>${P.formatTime(state.completedAt)}</b></p>
        <div class="actions"><button class="btn sun again" id="again">🔁 PLAY AGAIN</button></div>
      </main>`;
      $('view').onclick = () => { view = 'passport'; render(); };
      $('again').onclick = openAgain;
      showSend();
      sendFinish();
    }

    // Tell the organisers' Telegram (through /api/finish) who finished. Retries while this screen is open,
    // and on the next visit, until it gets through.
    function showSend(status) {
      const el = $('sendst');
      if (!el) return;
      el.textContent = state.sent ? '✓ Your name is in the draw'
        : status === 'fail' ? '⚠️ No connection: show this screen to a volunteer' : 'Sending your name…';
    }

    async function sendFinish() {
      if (!P.needsSending(state) || sending) return;
      sending = true;
      let ok = false;
      try {
        const ctl = new AbortController();
        const t = setTimeout(() => ctl.abort(), 8000);
        const r = await fetch('/api/finish', {
          method: 'POST', headers: { 'content-type': 'application/json' }, signal: ctl.signal,
          body: JSON.stringify({ name: state.name, drawNo: state.drawNo, finishedAt: state.completedAt }),
        });
        clearTimeout(t);
        ok = r.ok;
      } catch { /* offline or timed out */ }
      sending = false;
      if (ok) { state = P.markSent(state); persist(); }
      showSend(ok ? 'ok' : 'fail');
      if (!ok && view === 'done') timers.push(setTimeout(sendFinish, 15000));
    }

    function openAgain() {
      openSheet(`<h2 id="sheet-title">Start a new passport?</h2>
        <p>This clears your stickers and this screen. <b>Show it to a volunteer first!</b></p>
        <button class="btn" id="yes">YES, NEW PASSPORT</button>
        <button class="btn2" id="close">Keep this screen</button>`, 'close');
      $('yes').onclick = () => { state = P.restart(state); persist(); view = 'cover'; render(); };
    }

    // Bottom sheet; used for the rules and to confirm a new passport. The element with id closeId closes it.
    function openSheet(html, closeId) {
      if ($('sheet')) return;
      const opener = document.activeElement;
      const dim = document.createElement('div');
      dim.className = 'dim';
      dim.id = 'sheet';
      dim.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">${html}</div>`;
      document.body.appendChild(dim);
      const onKey = e => { if (e.key === 'Escape') close(); };
      const close = () => { dim.remove(); document.removeEventListener('keydown', onKey); if (opener?.isConnected) opener.focus({ preventScroll: true }); };
      document.addEventListener('keydown', onKey);
      dim.onclick = e => { if (e.target === dim) close(); };
      $(closeId).onclick = close;
      $(closeId).focus({ preventScroll: true });
    }

    function openRules() {
      openSheet(`<h2 id="sheet-title">How it works</h2>${RULES}<button class="btn" id="close">GOT IT</button>`, 'close');
    }

    render();
  </script>
</body>
</html>
