<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow, noai, noimageai">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6ecd6">
  <title>Tombola staff · ESN Bologna</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B1%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <style>
    .stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 10px 0; }
    .ball { width: min(80vw, 330px); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; position: relative;
      background: radial-gradient(circle at 34% 28%, #fff 0 12%, var(--paper) 40%, #ead9b6 100%); border: 6px solid var(--red);
      box-shadow: inset -14px -18px 0 rgba(58,29,16,.08), 0 10px 0 var(--line); }
    .ball b { font-size: min(40vw, 168px); font-weight: 900; color: var(--red); letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; }
    .ball b.wait { color: var(--line); }
    .ball.roll { animation: roll .26s linear infinite; }
    .ball.roll b { filter: blur(1px); opacity: .8; }
    .ball.land { animation: land .6s cubic-bezier(.3,1.7,.5,1); }
    @keyframes roll { 0% { transform: rotate(-14deg) translateY(0); } 50% { transform: rotate(14deg) translateY(-10px); } 100% { transform: rotate(-14deg) translateY(0); } }
    @keyframes land { 0% { transform: scale(.6) translateY(-50px); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
    .words { margin: 20px 0 0; font-size: 25px; font-weight: 800; line-height: 1.45; }
    .words span { color: var(--mute); font-weight: 700; }
    .smorfia { margin: 10px 0 0; font-size: 20px; font-style: italic; color: var(--mute); }
    .words, .smorfia { animation: fade .5s ease-out both; }
    .ball.roll ~ .words, .ball.roll ~ .smorfia { visibility: hidden; }

    .last { display: flex; gap: 8px; justify-content: center; align-items: center; margin: 4px 0 18px; min-height: 42px; }
    .last small { font-size: 11px; font-weight: 800; letter-spacing: .12em; color: var(--mute); margin-right: 2px; }
    .last span { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-size: 17px; font-weight: 900; background: var(--paper); border: 2.5px solid var(--red); color: var(--red); }
    .stack .btn.white { margin-top: 14px; padding: 15px 12px; font-size: 18px; }
    .tools { display: flex; justify-content: space-between; }
    .tools .link { width: auto; font-size: 15px; }

    .board { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; margin: 14px 0 6px; }
    .board span { aspect-ratio: 1; display: grid; place-items: center; border-radius: 50%; font-size: min(3.9vw, 17px); font-weight: 800; color: var(--line); background: var(--bg); }
    .board span.out { background: var(--red); color: var(--cream); }
    .board span.now { background: var(--ink); color: var(--cream); box-shadow: 0 0 0 3px var(--paper), 0 0 0 5px var(--ink); }
    .box .count { margin: 4px 0 0; font-size: 15px; font-weight: 700; color: var(--mute); }

    @media (max-height: 700px) {
      .ball { width: min(62vw, 240px); }
      .ball b { font-size: min(30vw, 120px); }
      .words { font-size: 20px; margin-top: 12px; line-height: 1.3; }
      .smorfia { font-size: 16px; margin-top: 6px; }
      .last { margin-bottom: 12px; }
      .last span { width: 36px; height: 36px; font-size: 15px; }
      .stack .btn.white { margin-top: 12px; padding: 12px; font-size: 16px; }
      .tools .link { padding-top: 8px; }
    }
  </style>
</head>
<body>
<div id="app"></div>
<script type="module">
import * as S from './draw.js';
import { words } from './words.js';
import { SMORFIA } from './smorfia.js';

const T = {
  it: { draw: 'Estrai', board: 'Numeri usciti', before: 'PRIMA', first: 'Tocca «Estrai» per il primo numero',
    of: n => `${n} usciti su 90`, undo: 'Annulla ultimo', newGame: 'Nuova partita', close: 'Chiudi', allOut: 'Tutti i numeri sono usciti!',
    undoQ: n => `Annullare il ${n}?`, undoP: 'Torna nel sacchetto e può riuscire.', undoYes: 'Sì, annulla',
    newQ: 'Nuova partita?', newP: 'I numeri usciti si cancellano.', newYes: 'Sì, ricomincia' },
  en: { draw: 'Draw', board: 'Numbers out', before: 'BEFORE', first: 'Tap “Draw” for the first number',
    of: n => `${n} of 90 out`, undo: 'Undo last', newGame: 'New game', close: 'Close', allOut: 'All the numbers are out!',
    undoQ: n => `Undo ${n}?`, undoP: 'It goes back in the bag and can come out again.', undoYes: 'Yes, undo',
    newQ: 'New game?', newP: 'The numbers drawn will be cleared.', newYes: 'Yes, start over' },
  es: { draw: 'Sacar', board: 'Números salidos', before: 'ANTES', first: 'Toca «Sacar» para el primer número',
    of: n => `${n} de 90 salidos`, undo: 'Deshacer último', newGame: 'Nueva partida', close: 'Cerrar', allOut: '¡Han salido todos los números!',
    undoQ: n => `¿Deshacer el ${n}?`, undoP: 'Vuelve a la bolsa y puede volver a salir.', undoYes: 'Sí, deshacer',
    newQ: '¿Nueva partida?', newP: 'Se borrarán los números salidos.', newYes: 'Sí, empezar de nuevo' },
};
const ROLL_MS = 1300;

const store = S.safeStorage();
if (new URLSearchParams(location.search).has('reset')) { S.clear(store); history.replaceState(null, '', location.pathname); }
const nav = (navigator.language || '').toLowerCase();
let s = S.load(store) || S.fresh(nav.startsWith('es') ? 'es' : nav.startsWith('en') ? 'en' : 'it');
let overlay = null; // 'board' | 'undo' | 'new'
let rolling = false;
const app = document.getElementById('app');

function set(next) { if (next !== s) { s = next; S.save(store, s); } render(); }

function stage(t) {
  const n = S.last(s);
  if (!n) return `<div class="stage"><div class="ball"><b class="wait">?</b></div><p class="words"><span>${t.first}</span></p></div>`;
  const others = ['it', 'en', 'es'].filter(l => l !== s.lang);
  return `<div class="stage"><div class="ball"><b>${n}</b></div>
    <p class="words">${words(n, s.lang)}<br><span>${others.map(l => words(n, l)).join(' · ')}</span></p>
    <p class="smorfia">${SMORFIA[n].nap} · ${SMORFIA[n].it}</p></div>`;
}

function render() {
  const t = T[s.lang];
  document.documentElement.lang = s.lang;
  const lang = `<button class="pill" data-act="lang" aria-label="Italiano / English / Español">${S.LANGS.map(l => `<i class="${s.lang === l ? 'on' : ''}">${l.toUpperCase()}</i>`).join(' / ')}</button>`;
  const prev = s.drawn.slice(-6, -1).reverse();
  const done = !S.remaining(s).length;
  app.innerHTML = `<main class="screen">
    <div class="top"><span>ESN · TOMBOLA · STAFF</span><span class="right">${lang}</span></div>
    ${stage(t)}
    <div class="last">${prev.length ? `<small>${t.before}</small>${prev.map(n => `<span>${n}</span>`).join('')}` : ''}</div>
    <div class="stack">
      <button class="btn" data-act="draw" ${done ? 'disabled' : ''}>${done ? t.allOut : t.draw}</button>
      <button class="btn white" data-act="board">${t.board} · ${s.drawn.length}</button>
      <div class="tools"><button class="link" data-act="undo" ${s.drawn.length ? '' : 'disabled'}>${t.undo}</button><button class="link" data-act="new">${t.newGame}</button></div>
    </div></main>${overlayHtml(t)}`;
}

function overlayHtml(t) {
  switch (overlay) {
    case 'board': {
      const now = S.last(s);
      return `<div class="ov" data-act="close"><div class="box"><h3>${t.board}</h3><p class="count">${t.of(s.drawn.length)}</p>
        <div class="board">${S.ALL.map(n => `<span class="${n === now ? 'now' : s.drawn.includes(n) ? 'out' : ''}">${n}</span>`).join('')}</div>
        <button class="btn" data-act="close" style="margin-top:14px">${t.close}</button></div></div>`;
    }
    case 'undo': return `<div class="ov" data-act="close"><div class="box"><h3>${t.undoQ(S.last(s))}</h3><p>${t.undoP}</p>
      <button class="btn" data-act="undoYes">${t.undoYes}</button><button class="link" data-act="close">${t.close}</button></div></div>`;
    case 'new': return `<div class="ov" data-act="close"><div class="box"><h3>${t.newQ}</h3><p>${t.newP}</p>
      <button class="btn" data-act="newYes">${t.newYes}</button><button class="link" data-act="close">${t.close}</button></div></div>`;
  }
  return '';
}

// The ball shakes with numbers flickering, slowing down, then lands on the drawn one. Saved first, so a reload keeps it.
function drawNumber() {
  if (rolling) return;
  const next = S.draw(s);
  if (next === s) return;
  s = next;
  S.save(store, s);
  rolling = true;
  render();
  const ball = document.querySelector('.ball');
  const b = ball.querySelector('b');
  b.classList.remove('wait');
  ball.classList.add('roll');
  document.querySelector('[data-act=draw]').disabled = true;
  const start = performance.now();
  const tick = () => {
    const el = performance.now() - start;
    if (el >= ROLL_MS) {
      rolling = false;
      render();
      const landed = document.querySelector('.ball');
      landed.classList.add('land');
      try { navigator.vibrate?.(40); } catch { /* no vibration */ }
      return;
    }
    b.textContent = 1 + Math.floor(Math.random() * 90);
    setTimeout(tick, 45 + 160 * (el / ROLL_MS) ** 2); // slows down towards the end
  };
  tick();
}

app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const act = el.dataset.act;
  if (act === 'close' && el.classList.contains('ov') && e.target !== el) return; // taps inside the box
  if (rolling && act !== 'lang') return;
  switch (act) {
    case 'lang': if (!rolling) set(S.setLang(s, S.LANGS[(S.LANGS.indexOf(s.lang) + 1) % S.LANGS.length])); break;
    case 'draw': drawNumber(); break;
    case 'board': overlay = 'board'; render(); break;
    case 'undo': overlay = 'undo'; render(); break;
    case 'new': overlay = 'new'; render(); break;
    case 'close': overlay = null; render(); break;
    case 'undoYes': overlay = null; set(S.undo(s)); break;
    case 'newYes': overlay = null; set(S.reset(s)); break;
  }
});

// Keep the screen on while drawing.
let lock = null;
async function keepAwake() {
  try { if (document.visibilityState === 'visible' && 'wakeLock' in navigator) lock = await navigator.wakeLock.request('screen'); } catch { /* not allowed */ }
}
document.addEventListener('visibilitychange', keepAwake);
keepAwake();

render();
</script>
</body>
</html>
