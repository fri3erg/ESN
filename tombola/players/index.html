<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6ecd6">
  <title>Tombola · ESN Bologna</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B2%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <style>
    ol.steps { list-style: none; margin: 22px 0 0; padding: 0; display: grid; gap: 12px; }
    ol.steps li { display: flex; gap: 13px; align-items: center; font-size: 18px; font-weight: 600; line-height: 1.3; }
    ol.steps b { background: var(--red); color: var(--cream); border-radius: 11px; width: 38px; height: 38px; display: grid; place-items: center; font-size: 17px; flex: none; }
    .box ol.steps { margin-top: 14px; }
    .box ol.steps li { font-size: 16px; }
    .box h1 { font-size: 44px; margin: 0; }

    .sub { font-size: 17px; line-height: 1.4; margin: 10px 0 0; color: var(--mute); }
    .play { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 14px 0 4px; }
    .cartella { background: var(--paper); border: 3px solid var(--red); border-radius: 16px; padding: 7px; display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; box-shadow: 0 7px 0 var(--line); }
    .cartella button, .cartella span { aspect-ratio: .52; display: grid; place-items: center; border-radius: 7px; border: 0; padding: 0; font-weight: 900; font-size: min(6.4vw, 28px); position: relative; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    .cartella button { background: var(--paper); color: var(--red); box-shadow: inset 0 0 0 1.5px var(--line); }
    .cartella span { background: var(--empty); }
    .cartella button b { position: relative; z-index: 1; }
    /* crossed out: a big hand-drawn X over the number */
    .cartella button.x { background: #f1dfc0; }
    .cartella button.x b { z-index: 3; color: var(--ink); text-shadow: 0 0 3px #f1dfc0, 0 0 3px #f1dfc0, 0 0 6px #f1dfc0; }
    .cartella button.x::before, .cartella button.x::after { content: ""; position: absolute; z-index: 2; left: 50%; top: 50%; width: 128%; height: 6px; border-radius: 3px;
      background: var(--red); transform: translate(-50%, -50%) rotate(58deg); animation: cross .18s ease-out both; }
    .cartella button.x::after { transform: translate(-50%, -50%) rotate(-58deg); animation-delay: .1s; }
    @keyframes cross { from { width: 0; } }
    .wins { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 22px; }
    .wins b { font-size: 13px; font-weight: 800; letter-spacing: .04em; padding: 7px 11px; border-radius: 999px; border: 1.5px solid var(--red); color: var(--red); background: var(--paper); opacity: .55; }
    .wins b.on { background: var(--red); color: var(--cream); opacity: 1; }
    .hint { text-align: center; font-size: 15px; color: var(--mute); margin: 0; }

    /* tombola: the card stays (the staff check it) under a live banner */
    body.win::before { content: ""; position: fixed; inset: -60px; z-index: -1; pointer-events: none;
      background-image: radial-gradient(rgba(179,38,30,.22) 3px, transparent 3.5px); background-size: 34px 34px; animation: drift 7s linear infinite; }
    @keyframes drift { to { transform: translate(34px, 34px); } }
    .won { text-align: center; margin-top: 12px; }
    .won h2 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-style: italic; font-size: min(17vw, 70px); line-height: 1; color: var(--red); animation: wobble 1.8s ease-in-out infinite; }
    @keyframes wobble { 50% { transform: rotate(-3deg) scale(1.05); } }
    .prize { position: relative; overflow: hidden; display: inline-block; margin-top: 10px; background: var(--red); color: var(--cream); border-radius: 14px; padding: 12px 18px; font-weight: 900; font-size: 19px; }
    .prize::after { content: ""; position: absolute; top: 0; bottom: 0; width: 60px; left: -80px; background: linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent); animation: shine 2.6s ease-in-out infinite; }
    @keyframes shine { 60%, 100% { left: 110%; } }
    .at { margin: 10px 0 0; font-size: 12px; font-weight: 800; letter-spacing: .14em; color: var(--mute); }
    .at b { font-size: 26px; color: var(--ink); letter-spacing: .04em; margin-left: 6px; animation: beat 1.6s ease-in-out infinite; }
    @keyframes beat { 50% { color: var(--red); } }

    @media (max-height: 700px) {
      ol.steps { gap: 8px; margin-top: 14px; }
      ol.steps li { font-size: 15px; }
      ol.steps b { width: 30px; height: 30px; font-size: 14px; border-radius: 9px; }
      .sub { font-size: 15px; margin-top: 6px; }
      .play { padding-top: 8px; }
      .cartella button, .cartella span { aspect-ratio: .78; }
      .wins { margin-top: 14px; }
      .wins b { font-size: 12px; padding: 5px 9px; }
      .won h2 { font-size: 44px; }
      .prize { font-size: 16px; padding: 9px 14px; margin-top: 6px; }
      .at { margin-top: 6px; }
    }
  </style>
</head>
<body>
<div id="app"></div>
<script type="module">
import * as P from './card.js';

const T = {
  it: {
    rules: 'Regole', title: ['Tombola', 'ESN'], cardTitle: ['La tua', 'cartella'],
    steps: ['Lo staff urla i numeri.', 'Se il numero è sulla tua cartella, toccalo per segnarlo con una X. Ritocca per toglierla.',
      'Ambo, terno, quaterna, cinquina: 2, 3, 4 o 5 numeri sulla stessa riga. Se sei il primo, urlalo!', 'Tombola: tutta la cartella. Se sei il primo, urla «Tombola!» e mostrala allo staff per vincere un premio 🎁'],
    deal: 'Dammi la cartella', sub: 'Tocca i numeri quando li urlano.', hint: 'Tombola? Mostra la cartella allo staff 🎁',
    row: n => `${n} numeri sulla stessa riga · Sei il primo? Urlalo!`, all: 'Tutta la cartella · Urla «Tombola!»',
    show: 'Mostrala allo staff 🎁', at: 'FINITA ALLE',
    close: 'Chiudi', newGame: 'Nuova partita', newQ: 'Nuova partita?', newP: 'I segni su questa cartella si cancellano.',
    same: 'Stessa cartella, togli i segni', fresh: 'Nuova cartella',
  },
  en: {
    rules: 'Rules', title: ['Tombola', 'ESN'], cardTitle: ['Your', 'card'],
    steps: ['The staff shout the numbers.', 'If the number is on your card, tap it to cross it out with an X. Tap again to remove it.',
      'Ambo, terno, quaterna, cinquina: 2, 3, 4 or 5 numbers on the same row. If you’re the first, shout it!', 'Tombola: the whole card. If you’re the first, shout “Tombola!” and show it to the staff to win a prize 🎁'],
    deal: 'Get my card', sub: 'Tap the numbers when they’re called.', hint: 'Tombola? Show your card to the staff 🎁',
    row: n => `${n} numbers on one row · First? Shout it!`, all: 'The whole card · Shout “Tombola!”',
    show: 'Show this to the staff 🎁', at: 'COMPLETED AT',
    close: 'Close', newGame: 'New game', newQ: 'New game?', newP: 'The crosses on this card will be cleared.',
    same: 'Same card, clear the crosses', fresh: 'New card',
  },
  es: {
    rules: 'Reglas', title: ['Tombola', 'ESN'], cardTitle: ['Tu', 'cartón'],
    steps: ['El staff grita los números.', 'Si el número está en tu cartón, tócalo para tacharlo con una X. Vuelve a tocar para quitarla.',
      'Ambo, terno, quaterna, cinquina: 2, 3, 4 o 5 números en la misma fila. Si eres el primero, ¡grítalo!', 'Tombola: todo el cartón. Si eres el primero, grita «¡Tombola!» y enséñaselo al staff para ganar un premio 🎁'],
    deal: 'Dame mi cartón', sub: 'Toca los números cuando los canten.', hint: '¿Tombola? Enséñale tu cartón al staff 🎁',
    row: n => `${n} números en la misma fila · ¿Eres el primero? ¡Grítalo!`, all: 'Todo el cartón · ¡Grita «Tombola»!',
    show: 'Enséñaselo al staff 🎁', at: 'COMPLETADO A LAS',
    close: 'Cerrar', newGame: 'Nueva partida', newQ: '¿Nueva partida?', newP: 'Se borrarán las cruces de este cartón.',
    same: 'Mismo cartón, borrar las cruces', fresh: 'Cartón nuevo',
  },
};
const NAMES = ['', 'Ambo', 'Terno', 'Quaterna', 'Cinquina', 'Tombola'];

const store = P.safeStorage();
if (new URLSearchParams(location.search).has('reset')) { P.clear(store); history.replaceState(null, '', location.pathname); }
const nav = (navigator.language || '').toLowerCase();
let s = P.load(store) || P.fresh(nav.startsWith('it') ? 'it' : nav.startsWith('es') ? 'es' : 'en');
let overlay = null; // 'rules' | 'new'
const app = document.getElementById('app');

function set(next) { if (next !== s) { s = next; P.save(store, s); } render(); }

function top(t) {
  const lang = `<button class="pill" data-act="lang" aria-label="Italiano / English / Español">${P.LANGS.map(l => `<i class="${s.lang === l ? 'on' : ''}">${l.toUpperCase()}</i>`).join(' / ')}</button>`;
  const rules = s.phase === 'rules' ? '' : `<button class="pill" data-act="rules">${t.rules}</button>`;
  return `<div class="top"><span>ESN · TOMBOLA</span><span class="right">${lang}${rules}</span></div>`;
}

const steps = t => `<ol class="steps">${t.steps.map((x, i) => `<li><b>${i + 1}</b><span>${x}</span></li>`).join('')}</ol>`;

function cardHtml() {
  return `<div class="cartella">${s.card.flat().map(n => n
    ? `<button class="${s.marked.includes(n) ? 'x' : ''}" data-n="${n}" aria-pressed="${s.marked.includes(n)}"><b>${n}</b></button>`
    : '<span></span>').join('')}</div>`;
}

function screen(t) {
  if (s.phase === 'rules') return `
    <h1>${t.title[0]} <em>${t.title[1]}</em></h1>
    ${steps(t)}
    <div class="push"><button class="btn" data-act="deal">${t.deal}</button></div>`;
  const won = s.tombolaAt;
  const head = won
    ? `<div class="won"><h2>Tombola!</h2><div class="prize">${t.show}</div><p class="at">${t.at}<b>${P.formatTime(s.tombolaAt)}</b></p></div>`
    : `<h1>${t.cardTitle[0]} <em>${t.cardTitle[1]}</em></h1><p class="sub">${t.sub}</p>`;
  return `${head}
    <div class="play">${cardHtml()}
      <div class="wins">${NAMES.slice(1).map((w, i) => `<b class="${s.best >= i + 1 ? 'on' : ''}">${w}</b>`).join('')}</div></div>
    ${won ? '' : `<p class="hint">${t.hint}</p>`}`;
}

function overlayHtml(t) {
  if (overlay === 'rules') return `<div class="ov" data-act="close"><div class="box"><h1>${t.title[0]} <em>${t.title[1]}</em></h1>${steps(t)}
    <button class="btn" data-act="close" style="margin-top:18px">${t.close}</button><button class="link" data-act="new">${t.newGame}</button></div></div>`;
  if (overlay === 'new') return `<div class="ov" data-act="close"><div class="box"><h3>${t.newQ}</h3><p>${t.newP}</p>
    <button class="btn" data-act="same">${t.same}</button><button class="btn white" data-act="fresh" style="margin-top:16px">${t.fresh}</button>
    <button class="link" data-act="close">${t.close}</button></div></div>`;
  return '';
}

function render() {
  const t = T[s.lang];
  document.documentElement.lang = s.lang;
  document.body.classList.toggle('win', !!s.tombolaAt);
  app.innerHTML = `<main class="screen">${top(t)}${screen(t)}</main>${overlayHtml(t)}`;
}

function flash(win) {
  const t = T[s.lang];
  document.querySelector('.flash')?.remove();
  const f = document.createElement('div');
  f.className = 'flash';
  f.innerHTML = `<div><span class="em">${win === 5 ? '🏆' : '🎉'}</span><strong>${NAMES[win]}!</strong><small>${win === 5 ? t.all : t.row(win + 1)}</small></div>`;
  document.body.append(f);
  setTimeout(() => f.remove(), 1700);
  try { navigator.vibrate?.(win === 5 ? [80, 60, 80, 60, 200] : 60); } catch { /* no vibration */ }
}

function confetti(count = 110, ms = 4600) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box = document.createElement('div');
  box.className = 'confetti';
  const colors = ['#b3261e', '#fff7e8', '#6b3b1f', '#e0a526', '#2f6b3f', '#f3b8a8'];
  for (let i = 0; i < count; i++) {
    const p = document.createElement('i');
    p.style.left = `${Math.random() * 100}%`;
    p.style.background = colors[i % colors.length];
    p.style.setProperty('--dx', `${(Math.random() - .5) * 160}px`);
    p.style.setProperty('--r', `${Math.random() * 900 - 450}deg`);
    p.style.animationDuration = `${2 + Math.random() * 2.2}s`;
    p.style.animationDelay = `${Math.random() * .9}s`;
    if (i % 3 === 0) p.style.borderRadius = '50%';
    box.append(p);
  }
  document.body.append(box);
  setTimeout(() => box.remove(), ms);
}

app.addEventListener('click', e => {
  const cell = e.target.closest('[data-n]');
  if (cell) {
    const before = s.best;
    set(P.toggle(s, Number(cell.dataset.n)));
    if (s.best > before) { flash(s.best); if (s.best === 5) confetti(); }
    return;
  }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'close' && el.classList.contains('ov') && e.target !== el) return; // taps inside the box
  switch (act) {
    case 'lang': set(P.setLang(s, P.LANGS[(P.LANGS.indexOf(s.lang) + 1) % P.LANGS.length])); break;
    case 'rules': overlay = 'rules'; render(); break;
    case 'close': overlay = null; render(); break;
    case 'new': overlay = 'new'; render(); break;
    case 'deal': set(P.deal(s)); break;
    case 'same': overlay = null; set(P.clearMarks(s)); scrollTo(0, 0); break;
    case 'fresh': overlay = null; set(P.deal(s)); scrollTo(0, 0); break;
  }
});

render();
</script>
</body>
</html>
