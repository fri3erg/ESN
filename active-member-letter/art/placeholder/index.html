<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>…</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
</style>
</head>
<body>
<canvas id="view" aria-hidden="true"></canvas>
<script>
"use strict";
// Stand-in until the real ASCII art for a slide is ready: a slow cloud of letters in ESN colours
// that gathers towards the middle and twinkles. ?seed=<n> changes the pattern per slide.
const seed = parseInt(new URLSearchParams(location.search).get("seed") || "1", 10);
const COLS_ESN = ["#00aeef", "#ec008c", "#7ac143", "#f47b20"];
const CHARS = " .·:+*xo#%@";
const cv = document.getElementById("view"), ctx = cv.getContext("2d");
const FS = 12;
let W, H, cols, rows;
function size() {
  const d = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0);
  cols = Math.ceil(W / (FS * 0.6)); rows = Math.ceil(H / (FS * 1.15));
}
function hash(a, b, c) {
  let h = (Math.imul(a, 73856093) ^ Math.imul(b, 19349663) ^ Math.imul(c, 83492791)) >>> 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177) >>> 0;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
size(); addEventListener("resize", size);
const t0 = performance.now();
function frame(now) {
  const t = (now - t0) / 1000, grow = Math.min(1, t / 2.5);
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  ctx.font = `${FS}px Menlo, Consolas, monospace`; ctx.textBaseline = "top";
  const tick = Math.floor(t * 6);
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const dx = (c / cols - 0.5) * 2 * (W / H), dy = (r / rows - 0.5) * 2;
    const d = Math.hypot(dx, dy * 1.1);
    const wave = 0.5 + 0.5 * Math.sin(d * 5 - t * 1.2 + seed);
    const dens = Math.max(0, 1 - d * 1.25) * grow * (0.35 + 0.65 * wave);
    const h = hash(c, r, seed);
    if (h > dens * 0.55) continue;
    const lv = Math.min(CHARS.length - 1, 1 + Math.floor((dens + hash(c, r, tick) * 0.3) * (CHARS.length - 2)));
    ctx.globalAlpha = Math.min(1, 0.25 + dens);
    ctx.fillStyle = COLS_ESN[Math.floor(hash(c, r, seed + 9) * 4)];
    ctx.fillText(CHARS[lv], c * FS * 0.6, r * FS * 1.15);
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
