<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noai, noimageai">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ciao amori miei</title>
<meta name="description" content="Sì lo so, grande sorpresa">
<meta property="og:title" content="Ciao amori miei">
<meta property="og:description" content="Sì lo so, grande sorpresa">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000; --dim: #9d978c;
    --c: #f3efe7;                       /* the slide's text colour, set per slide */
    --pad: clamp(16px, 4vw, 56px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--c); overflow: hidden; }
  body { -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; cursor: pointer; }

  /* ---------- a slide: text in the top part, art below (or behind) ---------- */
  .slide { position: fixed; inset: 0; display: flex; flex-direction: column; opacity: 0; visibility: hidden;
    transition: opacity .7s ease, visibility 0s linear .7s; }
  .slide.on { opacity: 1; visibility: visible; transition: opacity .7s ease .15s, visibility 0s; }

  .text { position: relative; z-index: 2; flex: none; max-height: 52%; overflow-y: auto; touch-action: pan-y;
    width: 100%; max-width: 980px; margin: 0 auto; text-align: center;
    padding: calc(34px + env(safe-area-inset-top)) var(--pad) 10px; }
  .art { position: relative; flex: 1; min-height: 46%; }
  /* --zoom enlarges the art (cropping its sides), --down pushes it lower (cropping its bottom) */
  /* on wide screens the art grows with the frame's height, so --down counts for a quarter there */
  .art { --zoom: 1; --down: 0%; --down-k: 1; overflow: hidden; }
  @media (min-aspect-ratio: 1/1) { .art { --down-k: .25; } .art[style*="--zoom-wide"] { --zoom: var(--zoom-wide); } }
  .art iframe { position: absolute; border: 0; pointer-events: none; background: #000;
    width: calc(var(--zoom) * 100%); left: calc((1 - var(--zoom)) * 50%);
    height: calc(var(--zoom) * 100% + var(--down) * var(--down-k)); top: calc((1 - var(--zoom)) * 50%);
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 14%, #000 100%);
            mask-image: linear-gradient(to bottom, transparent 0, #000 14%, #000 100%); }

  /* the art fills the screen behind the text, darkened under the words so they stay readable */
  .slide.behind .art { position: absolute; inset: 0; min-height: 0; }
  .slide.behind .art iframe { -webkit-mask-image: none; mask-image: none; }
  .slide.behind .art::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(to bottom, rgba(0,0,0,.72) 0, rgba(0,0,0,.45) 34%, transparent 55%); }
  /* text in the middle of the screen (rain), or a bit lower than the top (cobwebs) */
  .slide.middle .text { margin: auto; max-height: 80%; transform: translateY(-7vh); }
  .slide.big .lead { font-size: clamp(40px, 4.6vw + 2vh, 84px); }
  .slide.swap .lead { font-weight: 500; font-size: clamp(24px, 1.6vw + 1.1vh, 34px); color: color-mix(in srgb, var(--c) 82%, #fff); }
  .slide.swap .body p { font-weight: 700; font-size: clamp(30px, 2.6vw + 1.5vh, 52px); line-height: 1.15; color: var(--c); }
  .slide.middle .art::after { background: radial-gradient(ellipse at center, rgba(0,0,0,.55), rgba(0,0,0,.2) 70%); }
  .slide.lower .text { margin-top: 16vh; }
  /* a lighter shade under the words, for art whose sky should show (sunrise) */
  .slide.light .art::after { background: linear-gradient(to bottom, rgba(0,0,0,.4) 0, rgba(0,0,0,.2) 30%, transparent 50%); }
  /* art that rises a little under the text */
  .slide.overlap .art { margin-top: -14vh; }

  /* the words: handwriting, glowing softly in the slide's colour */
  .lead, .body p { color: var(--c); text-wrap: balance;
    text-shadow: 0 0 22px color-mix(in srgb, var(--c) 35%, transparent), 0 2px 3px #000, 0 0 2px #000; }
  .lead { font-family: "Caveat", cursive; font-weight: 700; line-height: 1.1; margin: 0 0 .3em;
    font-size: clamp(32px, 3.4vw + 1.6vh, 66px); }
  .lead.long { font-size: clamp(25px, 2.1vw + 1.3vh, 44px); line-height: 1.2; }
  .body p { font-family: "Caveat", cursive; font-weight: 500; line-height: 1.22; margin: 0 auto .35em;
    font-size: clamp(25px, 1.7vw + 1.2vh, 38px); max-width: 30em;
    color: color-mix(in srgb, var(--c) 82%, #fff); }

  /* lines come in one after another */
  .reveal { opacity: 0; transform: translateY(12px); filter: blur(5px);
    transition: opacity .9s ease, transform .9s cubic-bezier(.2,.7,.2,1), filter .9s ease; }
  .slide.on .reveal { opacity: 1; transform: none; filter: none; transition-delay: var(--d, 0s); }

  .cover .lead { font-size: clamp(46px, 6vw + 2vh, 104px); }
  .hint { position: absolute; z-index: 3; left: 0; right: 0; bottom: calc(84px + env(safe-area-inset-bottom));
    text-align: center; font-family: "Caveat", cursive; font-size: 20px; letter-spacing: .02em;
    color: var(--dim); line-height: 1.8; pointer-events: none; text-shadow: 0 1px 3px #000; }
  .hint b { color: #f3efe7; font-weight: 700; }
  @media (max-width: 480px) { .hint { font-size: 18px; letter-spacing: 0; } }
  /* on the cover, bottom centre, between the star and the counter */
  .noai { position: absolute; z-index: 3; left: 80px; right: 80px; bottom: calc(26px + env(safe-area-inset-bottom));
    text-align: center; font-family: "Caveat", cursive; font-size: 17px; color: var(--dim);
    pointer-events: none; text-shadow: 0 1px 3px #000; }

  /* ---------- chrome ---------- */
  .progress { position: fixed; top: calc(10px + env(safe-area-inset-top)); left: var(--pad); right: var(--pad);
    display: flex; gap: 5px; z-index: 5; pointer-events: none; }
  .progress i { flex: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,.16); transition: background .5s ease; }
  .progress i.done { background: rgba(255,255,255,.55); }
  .progress i.now { background: var(--c); }

  .back { position: fixed; left: calc(12px + env(safe-area-inset-left)); bottom: calc(12px + env(safe-area-inset-bottom));
    width: 58px; height: 58px; padding: 9px; border: 0; border-radius: 50%; background: rgba(0,0,0,.55);
    box-shadow: 0 0 0 1px rgba(255,255,255,.08); cursor: pointer; z-index: 6; transition: opacity .4s ease, transform .3s ease; }
  .back:hover { transform: rotate(-22deg) scale(1.06); }
  .back:active { transform: rotate(-45deg) scale(.94); }
  .back[disabled] { opacity: .28; cursor: default; transform: none; }
  .back svg { width: 100%; height: 100%; display: block; }

  .count { position: fixed; right: calc(16px + env(safe-area-inset-right)); bottom: calc(26px + env(safe-area-inset-bottom));
    font-family: "Caveat", cursive; font-size: 18px; color: var(--dim); z-index: 5; pointer-events: none;
    text-shadow: 0 1px 3px #000; }

  @media (prefers-reduced-motion: reduce) {
    .reveal, .slide { transition: opacity .3s ease !important; transform: none !important; filter: none !important; }
  }
</style>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<div class="progress" id="progress"></div>
<main id="deck" aria-live="polite"></main>
<button class="back" id="back" aria-label="Indietro" title="Indietro">
  <svg viewBox="-50 -50 100 100" aria-hidden="true">
    <!-- the ESN star: eight rounded bars around an octagon -->
    <g stroke-linecap="round" stroke-width="13">
      <line x1="0" y1="-14" x2="0" y2="-43" stroke="#7ac143"/>
      <line x1="10" y1="-10" x2="30.4" y2="-30.4" stroke="#ec008c"/>
      <line x1="14" y1="0" x2="43" y2="0" stroke="#f47b20"/>
      <line x1="10" y1="10" x2="30.4" y2="30.4" stroke="#7ac143"/>
      <line x1="0" y1="14" x2="0" y2="43" stroke="#00aeef"/>
      <line x1="-10" y1="10" x2="-30.4" y2="30.4" stroke="#f47b20"/>
      <line x1="-14" y1="0" x2="-43" y2="0" stroke="#ec008c"/>
      <line x1="-10" y1="-10" x2="-30.4" y2="-30.4" stroke="#00aeef"/>
    </g>
  </svg>
</button>
<div class="count" id="count"></div>

<script type="module">
import { SLIDES } from "./slides.js";
import { step, gesture, slideFromHash } from "./nav.js";

const deck = document.getElementById("deck"), progress = document.getElementById("progress");
const back = document.getElementById("back"), count = document.getElementById("count");
const N = SLIDES.length;

const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

// build every slide once; the art iframe is only loaded while its slide is showing
const els = SLIDES.map((s, i) => {
  const el = document.createElement("section");
  el.className = "slide" + (s.cover ? " cover" : "") + (s.behind ? " behind" : "") + (s.overlap ? " overlap" : "")
    + (s.textAt ? " " + s.textAt : "");
  el.style.setProperty("--c", s.color);
  el.setAttribute("aria-hidden", "true");
  let d = 0.5;
  const next = () => (d += 0.5, `style="--d:${d.toFixed(2)}s"`);
  el.innerHTML = `
    <div class="text">
      <h1 class="lead reveal${s.lead.length > 70 ? " long" : ""}" style="--d:${d}s">${esc(s.lead).replace(/\n/g, "<br>")}</h1>
      <div class="body">${s.body.map((p) => `<p class="reveal" ${next()}>${esc(p).replace(/\n/g, "<br>")}</p>`).join("")}</div>
    </div>
    <div class="art"></div>
    ${s.cover ? `<div class="hint reveal" ${next()}><b>tocca</b> o <b>scorri</b> per andare avanti<br>
      <b>stella</b> in basso a sinistra per tornare indietro</div>
      <div class="noai reveal" ${next()}>nessuna IA usata per il testo</div>` : ""}`;
  deck.appendChild(el);
  progress.appendChild(document.createElement("i"));
  return el;
});

const artUrl = (i) => SLIDES[i].art || `art/placeholder/?seed=${i + 1}`;

let cur = -1;
function show(i) {
  if (i === cur) return;
  const prev = cur;
  cur = i;
  els.forEach((el, k) => {
    el.classList.toggle("on", k === i);
    el.setAttribute("aria-hidden", k === i ? "false" : "true");
  });
  // a fresh iframe so the art plays its intro each time; the old one goes once it has faded out
  const box = els[i].querySelector(".art");
  if (SLIDES[i].zoom) box.style.setProperty("--zoom", SLIDES[i].zoom);
  if (SLIDES[i].down) box.style.setProperty("--down", SLIDES[i].down + "%");
  if (SLIDES[i].zoomWide) box.style.setProperty("--zoom-wide", SLIDES[i].zoomWide);
  box.innerHTML = `<iframe src="${artUrl(i)}" title="" tabindex="-1"></iframe>`;
  if (prev >= 0) setTimeout(() => { if (cur !== prev) els[prev].querySelector(".art").innerHTML = ""; }, 900);
  [...progress.children].forEach((b, k) => { b.className = k < i ? "done" : k === i ? "now" : ""; });
  progress.style.setProperty("--c", SLIDES[i].color);
  back.disabled = i === 0;
  count.textContent = `${i + 1} / ${N}`;
  history.replaceState(null, "", i ? `#${i + 1}` : location.pathname + location.search);
  els[i].querySelector(".text").scrollTop = 0;
}
const go = (dir) => show(step(cur, dir, N));

// touch, pen and mouse: a tap or a swipe left goes forward, a swipe right goes back
let start = null;
addEventListener("pointerdown", (e) => {
  if (e.target.closest(".back") || (e.pointerType === "mouse" && e.button !== 0)) { start = null; return; }
  start = { x: e.clientX, y: e.clientY };
});
addEventListener("pointerup", (e) => {
  if (!start) return;
  const dir = gesture(e.clientX - start.x, e.clientY - start.y);
  start = null;
  if (dir) go(dir);
});
addEventListener("pointercancel", () => { start = null; });
back.addEventListener("click", (e) => { e.stopPropagation(); go(-1); });

addEventListener("keydown", (e) => {
  if (["ArrowRight", "ArrowDown", "PageDown", " ", "Enter"].includes(e.key)) { e.preventDefault(); go(1); }
  else if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); go(-1); }
  else if (e.key === "Home") show(0);
  else if (e.key === "End") show(N - 1);
});
addEventListener("hashchange", () => show(slideFromHash(location.hash, N)));

show(slideFromHash(location.hash, N));
</script>
</body>
</html>
